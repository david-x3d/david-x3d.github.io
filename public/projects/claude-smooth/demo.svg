<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Animation: a message lifts off, the reply fades in line by line, the sidebar slides out and back in">
  <style>
    .sb, .ch, .pill, .bub, .ln { animation-duration: 8s; animation-iteration-count: infinite; animation-fill-mode: both;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    .sb   { animation-name: sb; }
    .ch   { animation-name: ch; }
    .pill { animation-name: pill; }
    .bub  { animation-name: bub; transform-box: fill-box; transform-origin: 100% 100%; }
    .ln   { animation-name: ln; }
    .l2 { animation-delay: .22s } .l3 { animation-delay: .44s } .l4 { animation-delay: .66s } .l5 { animation-delay: .88s }

    @keyframes sb   { 0%, 50% { transform: translateX(0) }  58%, 76% { transform: translateX(-200px) } 84%, 100% { transform: translateX(0) } }
    @keyframes ch   { 0%, 50% { transform: translateX(0) }  58%, 76% { transform: translateX(-100px) } 84%, 100% { transform: translateX(0) } }
    @keyframes pill { 0%, 52% { opacity: 0 } 56%, 78% { opacity: 1 } 80%, 100% { opacity: 0 } }
    @keyframes bub  { 0%, 6% { opacity: 0; transform: translateY(22px) scale(.94) } 12%, 90% { opacity: 1; transform: none } 96%, 100% { opacity: 0; transform: none } }
    @keyframes ln   { 0%, 15% { opacity: 0; transform: translateY(6px) } 21%, 90% { opacity: 1; transform: none } 96%, 100% { opacity: 0; transform: none } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="800" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="360" fill="#262624"/>

    <!-- conversation: centred in whatever space the sidebar leaves -->
    <g class="ch">
      <rect x="548" y="34" width="132" height="30" rx="12" fill="#141413"/>
      <rect x="562" y="45" width="96" height="8" rx="4" fill="#8f8d86"/>
      <g fill="#c3c0b6" opacity=".55">
        <rect x="320" y="86"  width="360" height="8" rx="4"/>
        <rect x="320" y="104" width="334" height="8" rx="4"/>
        <rect x="320" y="122" width="210" height="8" rx="4"/>
      </g>

      <g class="bub">
        <rect x="514" y="158" width="166" height="30" rx="12" fill="#141413"/>
        <rect x="528" y="169" width="124" height="8" rx="4" fill="#8f8d86"/>
      </g>
      <g fill="#c3c0b6">
        <rect class="ln l1" x="320" y="208" width="360" height="8" rx="4"/>
        <rect class="ln l2" x="320" y="226" width="346" height="8" rx="4"/>
        <rect class="ln l3" x="320" y="244" width="352" height="8" rx="4"/>
        <rect class="ln l4" x="320" y="262" width="328" height="8" rx="4"/>
        <rect class="ln l5" x="320" y="280" width="176" height="8" rx="4"/>
      </g>

      <rect x="304" y="310" width="392" height="34" rx="14" fill="#30302e" stroke="#3d3c39"/>
      <rect x="322" y="323" width="110" height="8" rx="4" fill="#5d5c57"/>
      <circle cx="676" cy="327" r="9" fill="#d97757"/>
    </g>

    <!-- sidebar -->
    <g class="sb">
      <rect width="200" height="360" fill="#1f1e1d"/>
      <rect x="199.5" width="1" height="360" fill="#3a3936"/>
      <rect x="20" y="22" width="64" height="12" rx="6" fill="#d97757"/>
      <g fill="#5d5c57">
        <rect x="20" y="62"  width="96" height="8" rx="4"/>
        <rect x="20" y="86"  width="80" height="8" rx="4"/>
        <rect x="20" y="110" width="104" height="8" rx="4"/>
      </g>
      <rect x="20" y="146" width="40" height="6" rx="3" fill="#45443f"/>
      <rect x="10" y="162" width="180" height="26" rx="7" fill="#2f2e2b"/>
      <g fill="#8f8d86">
        <rect x="20" y="171" width="120" height="8" rx="4"/>
        <rect x="20" y="203" width="138" height="8" rx="4" opacity=".7"/>
        <rect x="20" y="227" width="100" height="8" rx="4" opacity=".7"/>
        <rect x="20" y="251" width="126" height="8" rx="4" opacity=".7"/>
        <rect x="20" y="275" width="112" height="8" rx="4" opacity=".7"/>
      </g>
      <circle cx="30" cy="334" r="10" fill="#45443f"/>
      <rect x="48" y="330" width="64" height="8" rx="4" fill="#5d5c57"/>
    </g>

    <!-- the small button left behind when the sidebar is collapsed -->
    <g class="pill">
      <rect x="12" y="12" width="70" height="28" rx="9" fill="#30302e"/>
      <rect x="22" y="21" width="10" height="10" rx="2" fill="none" stroke="#8f8d86" stroke-width="1.6"/>
      <rect x="40" y="22" width="32" height="8" rx="4" fill="#d97757"/>
    </g>
  </g>
</svg>
