<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>davidx3d · Android apps and small tools</title>
    <meta
      name="description"
      content="davidx3d, hobby developer from Germany. Android apps in Kotlin and Jetpack Compose, plus Wear OS, KDE Plasma and browser extensions."
    />
    <meta name="theme-color" content="#0a0f10" />
    <meta property="og:title" content="davidx3d" />
    <meta property="og:description" content="Android apps in Kotlin and Jetpack Compose. Small tools that feel good to use." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint so nothing flashes.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0a0f10' : '#f2f6f5'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
